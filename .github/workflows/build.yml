
name: Campus Meal Build (Android & iOS)

on:
  push:
    branches:
      - main # Kodu main branch'ine pushladığında başlar
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      submit_ios:
        description: Submit the iOS build to App Store Connect
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: campus-meal-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.19.4

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo-doctor

      - name: Verify Android bundle
        run: npx expo export --platform android

  # --- 1. ANDROID BUILD İŞLEMİ ---
  build-android:
    needs: validate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest # Android için Linux sunucusu
    timeout-minutes: 60
    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle
        run: npm ci

      - name: 🚀 Expo ve EAS'ı Kur
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 🛠️ Android Build Al
        run: eas build --platform android --profile production --local --non-interactive --output campus-meal.aab
        env:
          EXPO_DEBUG: true
      - name: 📤 Android Çıktısını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Meal-Android-App
          path: campus-meal.aab
          if-no-files-found: error
          retention-days: 14

  # --- 2. IOS BUILD İŞLEMİ ---
  build-ios:
    needs: validate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest # iOS için macOS sunucusu
    timeout-minutes: 90
    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle
        run: npm ci

      - name: 🚀 Expo ve EAS'ı Kur
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 🍏 En Güncel Xcode'u Seç (Apple Gereksinimi)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🛠️ iOS Build Al
        run: eas build --platform ios --profile production --local --non-interactive --output campus-meal.ipa
        env:
          EXPO_DEBUG: true

      - name: 🚀 App Store Connect'e Gönder
        if: github.event_name == 'workflow_dispatch' && inputs.submit_ios
        run: eas submit --platform ios --path campus-meal.ipa --non-interactive

      - name: 📤 iOS Çıktısını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Meal-iOS-App
          path: campus-meal.ipa
          if-no-files-found: error
          retention-days: 14
